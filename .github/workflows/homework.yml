name: Homework calendar

on:
  push:
    branches: [claude/homework-dashboard-calendar-0sq3ip]   # temporary, for testing
  schedule:
    # Every two hours, 8am-8pm US Eastern on weekdays (cron is UTC).
    - cron: "0 12-23/2 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homework-calendar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run parser tests
        run: python3 -m unittest discover -s tests

      - name: Fetch the deck
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python3 scripts/fetch_deck.py deck.txt deck.pdf

      - name: Extract the slide layout from the PDF
        run: |
          which pdftotext >/dev/null || sudo apt-get install -y -q poppler-utils >/dev/null
          pdftotext -bbox-layout deck.pdf deck-bbox.html
          pdftotext -layout deck.pdf deck-layout.txt
          echo "::group::deck-layout.txt"; cat deck-layout.txt; echo "::endgroup::"

      - name: Build homework.ics
        run: python3 scripts/homework_to_ics.py deck-bbox.html homework.ics homework.json

      - name: Keep a copy of the deck text for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deck-text
          path: |
            deck.txt
            deck.pdf
            deck-layout.txt
            deck-bbox.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit if changed
        run: |
          git config user.name "homework-bot"
          git config user.email "homework-bot@users.noreply.github.com"
          git add homework.ics homework.json
          if git diff --cached --quiet; then
            echo "No change to the homework calendar."
            exit 0
          fi
          git commit -m "Update homework calendar"
          git push
